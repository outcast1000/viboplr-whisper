name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: index.js matches align.js + plugin.js
        run: node scripts/build.mjs --check
      - name: Tests
        run: node --test
